services: 
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: s3-object-replicate-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit-user
      RABBITMQ_DEFAULT_PASS: rabbit-password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  postgres:
    image: postgres:16
    container_name: s3-object-replicate-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: s3-object-replicate-db
      POSTGRES_USER: pgsql-user
      POSTGRES_PASSWORD: pgsql-password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  rabbitmq_data:
  pg_data: